# Create the beam-pool-auth Secret first; use the same immutable image digest for both roles.
apiVersion: v1
kind: Service
metadata:
  name: beam-workers
spec:
  clusterIP: None
  selector:
    app: beam-worker
  ports:
    - name: rpc
      port: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-workers
spec:
  replicas: 4
  selector:
    matchLabels:
      app: beam-worker
  template:
    metadata:
      labels:
        app: beam-worker
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: beam-pool:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
          env:
            - name: BEAM_POOL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beam-pool-auth
                  key: token
          resources:
            requests: {cpu: '1', memory: 2Gi}
            limits: {cpu: '1', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [python3, -m, scripts.beam_pool, health]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [python3, -m, scripts.beam_pool, health]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: beam-pool
spec:
  selector:
    app: beam-pool
  ports:
    - name: rpc
      port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beam-pool
spec:
  # The gateway owns continuation handles, so run one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beam-pool
  template:
    metadata:
      labels:
        app: beam-pool
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: beam-pool:local
          imagePullPolicy: IfNotPresent
          args: [serve, --worker-dns, beam-workers:9001, --listen, '0.0.0.0:9000']
          ports:
            - containerPort: 9000
          env:
            - name: BEAM_POOL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: beam-pool-auth
                  key: token
          resources:
            requests: {cpu: '1', memory: 512Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: [python3, -m, scripts.beam_pool, health, --endpoint, '127.0.0.1:9000']
            periodSeconds: 5
